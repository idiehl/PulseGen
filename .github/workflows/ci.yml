name: pulsegen-ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: lukka/get-cmake@latest
      - name: Configure MSVC x64 compiler environment
        uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c # v1.13.0
        with:
          arch: x64
      - name: Prepare isolated ModelHost test boundary
        shell: pwsh
        run: |
          python -m pip install numpy==2.0.2
          "PULSEGEN_MODELHOST_PYTHON=$((Get-Command python).Source)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PULSEGEN_MODELHOST_ROOT=$((Resolve-Path modelhost).Path)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Bootstrap checksum-pinned codec runtime
        shell: pwsh
        run: ./scripts/bootstrap-codecs.ps1
      - name: Restore managed projects
        run: dotnet restore PulseGen.sln
      - name: Build managed projects
        run: dotnet build PulseGen.sln -c Release --no-restore
      - name: Test managed contracts
        run: dotnet test PulseGen.sln -c Release --no-build
      - name: Configure native engine
        run: cmake --preset windows-release
      - name: Build native engine
        run: cmake --build --preset windows-release
      - name: Test native engine
        run: ctest --preset windows-release
      - name: Validate model-host manifests
        run: |
          python -m unittest discover -s modelhost/tests -v
      - name: Verify managed/native render boundary
        shell: pwsh
        run: |
          Copy-Item out/native/release/native/PulseGen.Engine.dll managed/PulseGen.RenderCli/bin/Release/net10.0/PulseGen.Engine.dll
          dotnet run --project managed/PulseGen.RenderCli/PulseGen.RenderCli.csproj -c Release --no-build -- --output out/ci-render
      - name: Build and smoke-test portable Windows package
        shell: pwsh
        run: ./scripts/package-windows.ps1 -NoBuild
      - name: Retain private-alpha package candidate
        uses: actions/upload-artifact@v4
        with:
          name: pulsegen-win-x64-private-alpha
          path: |
            out/packages/PulseGen-*-win-x64.zip
            out/packages/PulseGen-*-win-x64.zip.sha256
          compression-level: 0
          if-no-files-found: error
