[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsegen-model-host"
version = "0.1.0"
description = "Local-only cancellable spectral and semantic analysis host for PulseGen."
requires-python = ">=3.11,<3.12"
dependencies = ["numpy==2.0.2"]

[tool.setuptools]
packages = ["pulsegen_model_host"]
